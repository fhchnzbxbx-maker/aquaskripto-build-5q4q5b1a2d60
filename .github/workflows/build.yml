name: Build Plugin
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Build with Gradle
        run: gradle build --no-daemon
      - name: Publish .jar release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          JAR=$(ls build/libs/*.jar 2>/dev/null | grep -v sources | grep -v javadoc | head -1)
          if [ -z "$JAR" ]; then echo "No jar produced"; exit 1; fi
          TAG="v${GITHUB_RUN_NUMBER}"
          git tag "$TAG"
          git push origin "$TAG"
          gh release create "$TAG" "$JAR" --title "AquaSkripto Build" --notes "Skompilowany plugin Paper"
